services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: pudu-postgis
    environment:
      POSTGRES_DB: pudu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - pudu_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d pudu"]
      interval: 5s
      timeout: 5s
      retries: 30

  load:
    image: postgis/postgis:16-3.4
    profiles: ["tools"]
    depends_on:
      postgis:
        condition: service_healthy
    environment: &connection
      PGHOST: postgis
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: pudu
      PGOPTIONS: "-c client_min_messages=warning -c jit=off"
    volumes:
      - ./:/pudu:ro
    command: >-
      psql -v ON_ERROR_STOP=1 --single-transaction
      -f /pudu/sql/schema.sql
      -f /pudu/data/sql/municipalities.sql
      -f /pudu/data/sql/roads.sql
      -f /pudu/data/sql/snaspe.sql
      -f /pudu/data/sql/water_bodies.sql
      -f /pudu/data/sql/urban_areas.sql
      -f /pudu/data/sql/toponyms.sql
      -f /pudu/sql/bcn_to_model.sql
      -f /pudu/data/sql/raw_observation.sql
      -f /pudu/sql/observations_to_model.sql
      -f /pudu/sql/risk_maps.sql
      -f /pudu/sql/maintenance.sql
      -f /pudu/sql/crud.sql
      -f /pudu/sql/analysis_functions.sql
      -c "select coalesce(rejection_reason, 'aceptada') as observations, count(*) as records
          from staging.raw_observation group by 1 order by 2 desc"

  queries:
    image: postgis/postgis:16-3.4
    profiles: ["tools"]
    depends_on:
      postgis:
        condition: service_healthy
    environment: *connection
    volumes:
      - ./:/pudu:ro
    command: >-
      psql -v ON_ERROR_STOP=1 -P pager=off
      -f /pudu/sql/basic_queries.sql
      -f /pudu/sql/spatial_queries.sql

  reload:
    image: postgis/postgis:16-3.4
    profiles: ["tools"]
    depends_on:
      postgis:
        condition: service_healthy
    environment: *connection
    volumes:
      - ./:/pudu:ro
    command: >-
      psql -v ON_ERROR_STOP=1 --single-transaction
      -f /pudu/data/sql/raw_observation.sql
      -f /pudu/sql/observations_to_model.sql
      -c "call pudu.refresh_derived()"
      -c "select load_batch, source, species, rows_read, rows_rejected, rows_inserted, rows_existing
          from pudu.load_log order by id desc limit 10"

  maintenance:
    image: postgis/postgis:16-3.4
    profiles: ["tools"]
    depends_on:
      postgis:
        condition: service_healthy
    environment: *connection
    volumes:
      - ./:/pudu:ro
      - ./backups:/backups
    command: bash /pudu/scripts/maintenance.sh /backups

  explain:
    image: postgis/postgis:16-3.4
    profiles: ["tools"]
    depends_on:
      postgis:
        condition: service_healthy
    environment: *connection
    volumes:
      - ./:/pudu:ro
    command: psql -v ON_ERROR_STOP=1 -P pager=off -f /pudu/sql/explain_analyze.sql

  crud_demo:
    image: postgis/postgis:16-3.4
    profiles: ["tools"]
    depends_on:
      postgis:
        condition: service_healthy
    environment: *connection
    volumes:
      - ./:/pudu:ro
    command: psql -v ON_ERROR_STOP=1 -P pager=off -f /pudu/sql/crud_demo.sql

  model:
    image: postgis/postgis:16-3.4
    profiles: ["tools"]
    depends_on:
      postgis:
        condition: service_healthy
    environment: *connection
    volumes:
      - ./:/pudu:ro
    command: psql -v ON_ERROR_STOP=1 -P pager=off -f /pudu/sql/model_description.sql

  replace_bcn:
    image: postgis/postgis:16-3.4
    profiles: ["tools"]
    depends_on:
      postgis:
        condition: service_healthy
    environment: *connection
    volumes:
      - ./:/pudu:ro
    command: >-
      psql -v ON_ERROR_STOP=1 --single-transaction
      -f /pudu/data/sql/municipalities.sql
      -f /pudu/data/sql/roads.sql
      -f /pudu/data/sql/snaspe.sql
      -f /pudu/data/sql/water_bodies.sql
      -f /pudu/data/sql/urban_areas.sql
      -f /pudu/data/sql/toponyms.sql
      -f /pudu/sql/bcn_replace.sql
      -c "call pudu.replace_bcn_layers()"

  scheduler:
    image: postgis/postgis:16-3.4
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      <<: *connection
      MAINTENANCE_INTERVAL_HOURS: "168"
      KEEP_DAYS: "30"
    volumes:
      - ./:/pudu:ro
      - ./backups:/backups
    command: bash /pudu/scripts/scheduler.sh /backups

volumes:
  pudu_data:
